<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#eceef1}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"THREE_BASE/build/three.module.js","three/addons/":"THREE_BASE/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const q = new URLSearchParams(location.search);
const size = Number(q.get("size") || 512);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(size, size);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeceef1);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
scene.add(sun);
const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 100);

window.ready = new GLTFLoader().loadAsync("/model.glb").then((gltf) => {
  const root = gltf.scene;
  let flat = 0;
  root.traverse((o) => {
    if (o.isMesh) {
      const m = o.material;
      if (!m.map && !o.geometry.attributes.color) flat++;
      if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
    }
  });
  scene.add(root);
  const box = new THREE.Box3().setFromObject(root);
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  window.fit = { center: sphere.center, radius: sphere.radius };
  return { flat, min: box.min.toArray(), max: box.max.toArray() };
});

window.renderAt = (azDeg, elDeg = 18) => {
  const { center, radius } = window.fit;
  const dist = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.05;
  const az = THREE.MathUtils.degToRad(azDeg), el = THREE.MathUtils.degToRad(elDeg);
  camera.position.set(
    center.x + dist * Math.cos(el) * Math.sin(az),
    center.y + dist * Math.sin(el),
    center.z + dist * Math.cos(el) * Math.cos(az),
  );
  camera.lookAt(center);
  sun.position.copy(camera.position).add(new THREE.Vector3(radius * 2, radius * 3, radius));
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL("image/png");
};
</script>
</body>
</html>
